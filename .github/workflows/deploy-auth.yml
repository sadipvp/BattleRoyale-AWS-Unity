name: Deploy — Auth Service

# Triggers when auth service code or the shared package changes on main.
# Only rebuilds the auth image, leaving matchmaking untouched.
on:
  push:
    branches: [main]
    paths:
      - 'services/auth/**'
      - 'services/shared/**'

jobs:
  # Re-run lint, tests, and docker-build for the auth service before deploying.
  # Duplicating these jobs here (rather than using workflow_run) keeps the dependency
  # explicit and scoped to paths that actually changed.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install flake8
          pip install -e services/shared
      - name: Lint shared package
        run: flake8 services/shared/shared/
      - name: Lint auth service
        run: flake8 services/auth/app/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pytest pytest-asyncio httpx aiosqlite

      - name: Install shared package
        working-directory: services/shared
        run: pip install -e .

      - name: Install auth dependencies
        working-directory: services/auth
        run: pip install -r requirements.txt
      - name: Run auth tests
        env:
          JWT_SECRET: test-secret
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: dev
          DB_PASSWORD: devpassword
          DB_NAME: authdb
        run: pytest services/auth/tests/ -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build auth image
        run: |
          docker build \
            -f services/auth/Dockerfile \
            -t auth-service:ci \
            .

  deploy-auth:
    name: Build, Push, Deploy Auth
    runs-on: ubuntu-latest
    needs: [lint, test, docker-build]   # deploy only if all checks pass

    permissions:
      id-token: write   # required for OIDC token exchange
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Exchange GitHub OIDC token for temporary AWS credentials.
      # The IAM role must trust token.actions.githubusercontent.com for this repo.
      # No long-lived access keys stored as secrets.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Build from repo root (context: .) so the Dockerfile can COPY services/shared
      - name: Build and push auth image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f services/auth/Dockerfile \
            -t $ECR_REGISTRY/tank-battle/auth-service:$IMAGE_TAG \
            -t $ECR_REGISTRY/tank-battle/auth-service:latest \
            .
          docker push $ECR_REGISTRY/tank-battle/auth-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/tank-battle/auth-service:latest

      # Force ECS to pull the new :latest image and replace the running task
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster tank-battle-cluster \
            --service auth-service \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}

      # Wait until the new task is healthy before marking the workflow green
      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster tank-battle-cluster \
            --services auth-service \
            --region ${{ secrets.AWS_REGION }}

      - name: Done
        run: echo "Auth service deployed — commit ${{ github.sha }}"
