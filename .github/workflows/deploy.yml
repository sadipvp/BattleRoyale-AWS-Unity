name: Deploy

# Runs on push to main only AFTER the CI workflow completes successfully.
# Uses OIDC for AWS authentication — no long-lived access keys stored as secrets.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Build, Push, Deploy
    runs-on: ubuntu-latest
    # Only deploy if CI passed (not just completed)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      id-token: write   # required for OIDC token exchange
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Exchange GitHub OIDC token for temporary AWS credentials
      # The IAM role must trust token.actions.githubusercontent.com for this repo
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

